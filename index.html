<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>دليل هاتف مطار مرسي علم الدولي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-blue: #00305B; 
            --light-gray: #E5E7EB; 
            --border-color: #D1D5DB; 
            --success-green: #28A745; 
            --danger-red: #DC3545; 
            --warning-yellow: #FFC107; 
            --info-cyan: #17a2b8;
            --text-dark: #333; 
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #F8F9FA; 
            margin: 0; 
            padding: 0; 
            color: var(--text-dark); 
            overflow-x: hidden;
        }
        
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo {
            width: 220px;
            animation: smokeEffect 2.5s forwards ease-in-out;
        }
        @keyframes smokeEffect {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            40% { transform: scale(1.2); opacity: 1; filter: blur(0); }
            80% { transform: scale(1.8) translateY(-20px); opacity: 0.5; filter: blur(10px); }
            100% { transform: scale(2.5) translateY(-40px); opacity: 0; filter: blur(20px); }
        }

        .top-header { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            background: white; 
            padding: 12px 10px; 
            border-bottom: 2px solid var(--primary-blue); 
        }
        .center-logo { 
            height: 70px; 
            max-width: 90%;
            object-fit: contain;
            cursor: pointer; 
            user-select: none; 
            transition: transform 0.3s ease;
        }
        .sub-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-top: 6px;
            margin-bottom: 0;
            text-align: center;
        }

        .container { max-width: 1200px; margin: 12px auto; padding: 0 8px; }
        
        .status-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success-green);
        }

        .controls-bar { 
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            margin-bottom: 12px; 
            align-items: center; 
            gap: 8px; 
        }

        .search-box { flex-grow: 1; position: relative; }
        .search-box input { 
            width: 100%; 
            padding: 8px 30px 8px 30px; 
            border: 1px solid var(--primary-blue); 
            border-radius: 6px; 
            font-family: 'Cairo'; 
            font-size: 13px; 
            box-sizing: border-box; 
        }
        .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--primary-blue); font-size: 13px; }
        .clear-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #999; cursor: pointer; display: none; font-size: 14px; }

        .controls-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn { 
            padding: 7px 12px; 
            border: none; 
            border-radius: 5px; 
            font-family: 'Cairo'; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            font-size: 13px; 
            white-space: nowrap; 
        }
        .btn-print { background-color: var(--primary-blue); color: white; }
        .btn-refresh { background-color: var(--info-cyan); color: white; }
        .btn-add { background-color: var(--success-green); color: white; display: none; }
        .btn-exit-admin { background-color: var(--danger-red); color: white; display: none; }

        .table-container { 
            background: white; 
            border-radius: 6px; 
            box-shadow: 0 0 8px rgba(0,0,0,0.05); 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: center; 
        }
        
        .print-spacer { display: none; }

        th { 
            background-color: var(--light-gray); 
            color: var(--primary-blue); 
            padding: 6px 4px; 
            font-size: 12px; 
            border: 1px solid var(--border-color); 
            font-weight: 700;
            white-space: nowrap;
        }

        td { 
            padding: 4px 4px; 
            border: 1px solid var(--border-color); 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-dark); 
            line-height: 1.2;
        }
        
        .dept-row { 
            background-color: #E5E7EB !important; 
        }
        .dept-row td {
            color: var(--primary-blue) !important; 
            font-weight: 900 !important; 
            font-size: 17px !important; 
            padding: 10px !important;
        }

        .mobile-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            direction: ltr;
        }
        
        .mobile-number-text {
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap;
        }

        .quick-actions {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .action-btn-call, .action-btn-wa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            font-size: 10px;
        }

        .action-btn-call { background-color: var(--primary-blue); } 
        .action-btn-wa { background-color: #25D366; }

        .action-cell { display: none; width: 70px; }
        .action-btns { display: flex; justify-content: center; gap: 3px; }
        .btn-icon { padding: 3px 6px; border: none; border-radius: 3px; color: white; cursor: pointer; font-size: 11px; }
        .btn-edit { background-color: var(--warning-yellow); color: #000; }
        .btn-delete { background-color: var(--danger-red); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 380px; }
        .modal-content input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Cairo'; font-size: 13px; }
        
        #emp-mobile {
            direction: ltr !important;
            text-align: right !important;
            font-family: monospace, 'Cairo';
            font-size: 13px;
        }

        .loading { text-align: center; padding: 15px; font-weight: bold; color: var(--primary-blue); font-size: 13px; }

        @media (max-width: 600px) {
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-buttons {
                justify-content: space-between;
            }
            .btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* إعدادات الطباعة الدقيقة */
        @media print {
            @page {
                size: A4 portrait;
                /* تصفير الهامش العلوي لإخفاء التاريخ والرابط، وضبط باقي الهوامش */
                margin-top: 0mm; 
                margin-bottom: 12mm; 
                margin-left: 10mm;
                margin-right: 10mm;
            }
            body {
                background: white !important;
                color: black !important;
                font-size: 10pt;
                font-family: 'Cairo', sans-serif !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            #splash-screen, .controls-bar, .action-cell, .btn-icon, .modal, .quick-actions, .status-container {
                display: none !important;
            }
            
            /* الصف الوهمي لإنشاء مساحة علوية لكل صفحة مطبوعة بدون ما يطبع الهيدر الافتراضي */
            .print-spacer { 
                display: table-row !important; 
                height: 12mm !important; 
            }
            .print-spacer td { 
                border: none !important; 
                background: transparent !important; 
                padding: 0 !important; 
            }

            .top-header {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                border-bottom: 1px solid var(--primary-blue) !important;
                padding-bottom: 8px !important;
                margin-bottom: 5px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .center-logo {
                display: block !important;
                height: 55px !important;
                margin: 0 auto !important;
            }
            .sub-title {
                display: block !important;
                font-size: 11pt !important;
                color: var(--primary-blue) !important;
                margin-top: 4px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .container { 
                max-width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            .table-container {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            table { 
                width: 100% !important; 
                max-width: 100% !important;
                border-collapse: collapse !important; 
            }
            thead { display: table-header-group; }
            th {
                background-color: var(--light-gray) !important;
                color: var(--primary-blue) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 5px !important;
                font-size: 10pt !important;
                border: 1px solid #aaa !important;
            }
            td {
                padding: 4px !important;
                font-size: 9pt !important;
                border: 1px solid #ccc !important;
            }
            tr { page-break-inside: avoid !important; break-inside: avoid !important; }
            
            .dept-row {
                background-color: #E5E7EB !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-after: avoid !important;
                break-after: avoid !important;
            }
            .dept-row td {
                color: var(--primary-blue) !important;
                font-weight: 900 !important;
                font-size: 13pt !important;
                padding: 6px !important;
            }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="Airportlogo.png" alt="Splash Logo" class="splash-logo">
    </div>

    <div class="top-header">
        <img src="Airportlogo.png" alt="Marsa Alam Logo" class="center-logo" id="secret-logo" title="الضغط 3 مرات للتعديل">
        <h2 class="sub-title">دليل هاتف مطار مرسي علم الدولي</h2>
    </div>

    <div class="container">
        <div class="status-container" id="connection-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text" style="color: var(--success-green);">متصل</span>
        </div>

        <div class="controls-bar">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="ابحث بالاسم، الوظيفة، الإدارة..." oninput="filterTable()">
                <i class="fas fa-times clear-icon" id="clear-search-btn" onclick="clearSearch()" title="مسح البحث"></i>
            </div>
            
            <div class="controls-buttons">
                <button class="btn btn-refresh" onclick="forceRefreshData()"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button class="btn btn-print" onclick="triggerPrint()"><i class="fas fa-print"></i> طباعة</button>
                <button class="btn btn-add" id="add-btn" onclick="openModal()"><i class="fas fa-plus"></i> إضافة</button>
                <button class="btn btn-exit-admin" id="exit-admin-btn" onclick="exitAdminMode()"><i class="fas fa-sign-out-alt"></i> إنهاء</button>
            </div>
        </div>

        <div class="table-container">
            <table id="directory-table">
                <thead>
                    <!-- الصف الوهمي لحماية ترويسة الجدول في بداية كل صفحة مقطوعة -->
                    <tr class="print-spacer"><td colspan="6"></td></tr>
                    <tr>
                        <th style="width: 35px;">م</th>
                        <th>الإسم</th>
                        <th>الوظيفة</th>
                        <th>أرضي</th>
                        <th>موبايل</th>
                        <th class="action-cell">إجراء</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" class="loading">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color: var(--primary-blue); border-bottom: 1px solid #ccc; padding-bottom: 8px; font-size: 15px; margin-top:0;">إضافة رقم جديد</h3>
            <input type="hidden" id="emp-id">
            <input type="text" id="emp-dept" placeholder="الإدارة">
            <input type="text" id="emp-name" placeholder="الإسم">
            <input type="text" id="emp-role" placeholder="الوظيفة">
            <input type="text" id="emp-ext" placeholder="الرقم الأرضي">
            <input type="text" id="emp-mobile" placeholder="الموبايل (مثال: 0100 000 0000)" oninput="formatMobileInput(this)" maxlength="13">
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-add" style="display:block; flex: 1;" onclick="saveRecord()">حفظ</button>
                <button class="btn btn-print" style="background:#6c757d; flex: 1;" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwb6SSVOS6nUk9sq5o7dK2QIn3sVDAXZWXt_6wpGW1tvTUYdjSUAlUm5IIqNGBFrTOZcg/exec'; 
        const CACHE_KEY = 'airport_directory_cache';
        
        let isAdmin = false;
        let adminPassword = "";
        let directoryData = [];

        // تحديث حالة الاتصال بإنترنت كل ثانيتين لضمان دقة المؤشر داخل التطبيق
        function updateConnectionStatus() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            if (navigator.onLine) {
                statusDot.style.backgroundColor = 'var(--success-green)';
                statusText.style.color = 'var(--success-green)';
                statusText.innerText = 'متصل (Online)';
            } else {
                statusDot.style.backgroundColor = 'var(--danger-red)';
                statusText.style.color = 'var(--danger-red)';
                statusText.innerText = 'غير متصل (Offline)';
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        setInterval(updateConnectionStatus, 2000);

        window.onload = () => {
            updateConnectionStatus();
            setTimeout(() => {
                let splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500); 
            }, 2500);
            loadData();
        };

        function triggerPrint() {
            setTimeout(() => { window.print(); }, 100);
        }

        function formatMobileInput(input) {
            let value = input.value.replace(/\D/g, ''); 
            if (value.length > 11) value = value.substring(0, 11);
            let formatted = '';
            if (value.length > 0) {
                formatted = value.substring(0, 4);
                if (value.length > 4) formatted += ' ' + value.substring(4, 7);
                if (value.length > 7) formatted += ' ' + value.substring(7, 11);
            }
            input.value = formatted;
        }

        let clicks = 0;
        let clickTimer;
        document.getElementById('secret-logo').addEventListener('click', () => {
            clicks++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clicks = 0; }, 1500); 
            if (clicks === 3) {
                if(isAdmin) { alert("أنت بالفعل في وضع التعديل!"); clicks = 0; return; }
                if(!navigator.onLine) { alert("لا يمكن تفعيل وضع التعديل بدون إنترنت!"); clicks = 0; return; }
                
                let pwd = prompt("أدخل الرقم السري:");
                if (pwd === "102030") {
                    adminPassword = pwd;
                    isAdmin = true;
                    document.getElementById('add-btn').style.display = 'flex';
                    document.getElementById('exit-admin-btn').style.display = 'flex';
                    document.querySelectorAll('.action-cell').forEach(cell => cell.style.display = 'table-cell');
                }
                clicks = 0;
            }
        });

        function exitAdminMode() {
            isAdmin = false;
            adminPassword = "";
            document.getElementById('add-btn').style.display = 'none';
            document.getElementById('exit-admin-btn').style.display = 'none';
            document.querySelectorAll('.action-cell').forEach(cell => cell.style.display = 'none');
        }

        async function loadData(isRefresh = false) {
            let cachedData = localStorage.getItem(CACHE_KEY);
            
            if (cachedData && !isRefresh && directoryData.length === 0) {
                directoryData = JSON.parse(cachedData);
                renderTable(directoryData);
            }

            if (!navigator.onLine) {
                if(isRefresh) alert("أنت غير متصل بالإنترنت. يرجى التحقق من الشبكة للمزامنة.");
                else if(!cachedData) document.getElementById('table-body').innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">لا يوجد اتصال بالإنترنت ولا توجد بيانات محفوظة مسبقاً.</td></tr>';
                return;
            }

            if (isRefresh) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="loading">جاري مزامنة أحدث البيانات...</td></tr>';
            }

            try {
                let response = await fetch(API_URL);
                let freshData = await response.json();
                directoryData = freshData;
                localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));
                renderTable(directoryData);
            } catch (error) {
                if (!cachedData) {
                    document.getElementById('table-body').innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">تعذر الاتصال بقاعدة البيانات.</td></tr>';
                } else if (isRefresh) {
                    alert("حدث خطأ أثناء المزامنة. سيتم عرض البيانات المحفوظة.");
                    renderTable(directoryData);
                }
            }
        }

        function forceRefreshData() {
            loadData(true);
        }

        function renderTable(data) {
            let tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if(data.length === 0) return tbody.innerHTML = '<tr><td colspan="6">لا توجد بيانات</td></tr>';

            let groupedData = {};
            data.forEach(row => {
                let dept = row.Department || 'إدارات أخرى';
                if (!groupedData[dept]) groupedData[dept] = [];
                groupedData[dept].push(row);
            });

            let counter = 1;
            for (const [dept, employees] of Object.entries(groupedData)) {
                tbody.innerHTML += `<tr class="dept-row"><td colspan="6">${dept}</td></tr>`;
                employees.forEach(emp => {
                    let empId = emp.ID || counter; 
                    let mobileRaw = emp.Mobile ? emp.Mobile.replace(/\D/g, '') : '';
                    
                    let waNumber = mobileRaw;
                    if(waNumber.startsWith('0')) waNumber = '20' + waNumber.substring(1);

                    let mobileContent = '-';
                    if (mobileRaw) {
                        mobileContent = `
                            <div class="mobile-cell">
                                <span class="mobile-number-text">${emp.Mobile}</span>
                                <div class="quick-actions">
                                    <a href="tel:${mobileRaw}" class="action-btn-call" title="اتصال"><i class="fas fa-phone-alt"></i></a>
                                    <a href="https://wa.me/${waNumber}" target="_blank" class="action-btn-wa" title="واتساب"><i class="fab fa-whatsapp"></i></a>
                                </div>
                            </div>
                        `;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td>${counter}</td>
                            <td>${emp.Name || ''}</td>
                            <td>${emp.Role || ''}</td>
                            <td style="color: var(--danger-red); font-weight: bold;">${emp.Ext || ''}</td>
                            <td>${mobileContent}</td>
                            <td class="action-cell">
                                <div class="action-btns">
                                    <button class="btn-icon btn-edit" onclick="editRecord('${empId}')"><i class="fas fa-pen"></i></button>
                                    <button class="btn-icon btn-delete" onclick="deleteRecord('${empId}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                    counter++;
                });
            }
            if(isAdmin) document.querySelectorAll('.action-cell').forEach(cell => cell.style.display = 'table-cell');
        }

        function filterTable() {
            let input = document.getElementById("search-input").value.toLowerCase();
            document.getElementById("clear-search-btn").style.display = input.length > 0 ? "block" : "none";

            let filteredData = directoryData.filter(row => 
                (row.Name && row.Name.toLowerCase().includes(input)) ||
                (row.Role && row.Role.toLowerCase().includes(input)) ||
                (row.Department && row.Department.toLowerCase().includes(input)) ||
                (row.Ext && row.Ext.toString().includes(input)) ||
                (row.Mobile && row.Mobile.toString().includes(input))
            );
            renderTable(filteredData);
        }

        function clearSearch() {
            let searchInput = document.getElementById("search-input");
            searchInput.value = ""; 
            searchInput.focus(); 
            filterTable(); 
        }

        function openModal(id = null) {
            document.getElementById('admin-modal').style.display = 'flex';
            if (id) {
                document.getElementById('modal-title').innerText = 'تعديل بيانات الموظف';
                let emp = directoryData.find(e => e.ID == id);
                if(emp) {
                    document.getElementById('emp-id').value = emp.ID;
                    document.getElementById('emp-dept').value = emp.Department || '';
                    document.getElementById('emp-name').value = emp.Name || '';
                    document.getElementById('emp-role').value = emp.Role || '';
                    document.getElementById('emp-ext').value = emp.Ext || '';
                    let mobileInput = document.getElementById('emp-mobile');
                    mobileInput.value = emp.Mobile || '';
                    formatMobileInput(mobileInput);
                }
            } else {
                document.getElementById('modal-title').innerText = 'إضافة رقم جديد';
                document.getElementById('emp-id').value = 'DIR-' + (directoryData.length + 1);
                document.querySelectorAll('.modal-content input[type="text"]').forEach(i => i.value = '');
            }
        }

        function closeModal() { document.getElementById('admin-modal').style.display = 'none'; }

        async function saveRecord() {
            if(!navigator.onLine) return alert("لا يمكنك إضافة أو تعديل بيانات وأنت غير متصل بالإنترنت!");

            let id = document.getElementById('emp-id').value;
            let payload = {
                password: adminPassword,
                action: directoryData.some(e => e.ID == id) ? 'edit' : 'add',
                id: id, 
                department: document.getElementById('emp-dept').value,
                name: document.getElementById('emp-name').value, 
                role: document.getElementById('emp-role').value,
                ext: document.getElementById('emp-ext').value, 
                mobile: document.getElementById('emp-mobile').value
            };
            closeModal();
            document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="loading">جاري الحفظ والمزامنة...</td></tr>';
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
            forceRefreshData(); 
        }

        function editRecord(id) { openModal(id); }
        
        async function deleteRecord(id) {
            if(!navigator.onLine) return alert("لا يمكنك حذف بيانات وأنت غير متصل بالإنترنت!");

            if(confirm('تأكيد الحذف؟')) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="loading">جاري الحذف...</td></tr>';
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ password: adminPassword, action: 'delete', id: id }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
                forceRefreshData();
            }
        }
    </script>
</body>
</html>
