<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل هاتف مطار مرسي علم الدولي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-blue: #00305B; 
            --light-gray: #E5E7EB; 
            --border-color: #D1D5DB; 
            --success-green: #28A745; 
            --danger-red: #DC3545; 
            --warning-yellow: #FFC107; 
            --text-dark: #333; 
        }
        body { font-family: 'Cairo', sans-serif; background-color: #F8F9FA; margin: 0; padding: 0; color: var(--text-dark); overflow-x: hidden; }
        
        /* شاشة البداية (Splash Screen) */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo {
            width: 250px;
            animation: smokeEffect 2.5s forwards ease-in-out;
        }
        @keyframes smokeEffect {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            40% { transform: scale(1.3); opacity: 1; filter: blur(0); }
            80% { transform: scale(2) translateY(-20px); opacity: 0.5; filter: blur(10px); }
            100% { transform: scale(3) translateY(-50px); opacity: 0; filter: blur(20px); }
        }

        /* الهيدر والعنوان */
        .top-header { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            background: white; 
            padding: 20px 20px 10px 20px; 
            border-bottom: 2px solid var(--primary-blue); 
        }
        .center-logo { 
            height: 90px; 
            cursor: pointer; 
            user-select: none; 
            transition: transform 0.3s ease;
        }
        .center-logo:hover {
            transform: scale(1.05);
        }
        .sub-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-top: 8px;
            margin-bottom: 0;
            text-align: center;
            font-family: 'Cairo', sans-serif;
        }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .controls-bar { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; gap: 15px; }
        
        /* شريط البحث */
        .search-box { flex-grow: 1; position: relative; }
        .search-box input { width: 100%; padding: 12px 40px 12px 40px; border: 1px solid var(--primary-blue); border-radius: 8px; font-family: 'Cairo'; font-size: 16px; box-sizing: border-box; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--primary-blue); }
        .clear-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999; cursor: pointer; display: none; font-size: 18px; transition: 0.2s; }
        .clear-icon:hover { color: var(--danger-red); }

        .btn { padding: 10px 20px; border: none; border-radius: 5px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
        .btn-print { background-color: var(--primary-blue); color: white; }
        .btn-add { background-color: var(--success-green); color: white; display: none; }
        .btn-exit-admin { background-color: var(--danger-red); color: white; display: none; }

        .table-container { background: white; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        
        th { 
            background-color: var(--light-gray); 
            color: var(--primary-blue); 
            padding: 15px; 
            font-size: 16px; 
            border: 1px solid var(--border-color); 
            font-weight: 700;
        }
        td { padding: 12px 15px; border: 1px solid var(--border-color); font-size: 15px; font-weight: 600; color: var(--text-dark); }
        
        .dept-row { 
            background-color: #F3F4F6; 
            color: var(--primary-blue); 
            font-weight: bold; 
            font-size: 17px; 
            page-break-after: avoid; 
            break-after: avoid; 
        }
        .action-cell { display: none; width: 100px; }
        .action-btns { display: flex; justify-content: center; gap: 5px; }
        .btn-icon { padding: 6px 10px; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .btn-edit { background-color: var(--warning-yellow); color: #000; }
        .btn-delete { background-color: var(--danger-red); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Cairo'; }
        .loading { text-align: center; padding: 20px; font-weight: bold; color: var(--primary-blue); }

        /* ==================== إعدادات الطباعة النظيفة والمضبوطة ==================== */
        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm 10mm 15mm 10mm; /* هوامش متوازنة ومريحة لمنع التداخل تماماً */
            }
            body {
                background: white !important;
                color: black !important;
                font-size: 11pt;
                font-family: 'Cairo', sans-serif !important;
                padding-top: 0 !important;
            }
            #splash-screen, .controls-bar, .action-cell, .btn-icon, .modal {
                display: none !important;
            }
            .top-header {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                border-bottom: 1px solid var(--primary-blue) !important;
                padding-bottom: 10px !important;
                margin-bottom: 15px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .center-logo {
                display: block !important;
                height: 65px !important;
                margin: 0 auto !important;
            }
            .sub-title {
                display: block !important;
                font-size: 13pt !important;
                color: var(--primary-blue) !important;
                font-family: 'Cairo', sans-serif !important;
                margin-top: 5px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            thead {
                display: table-header-group; /* تكرار رأس الجدول تلقائياً بدون تداخل */
            }
            th {
                background-color: var(--light-gray) !important;
                color: var(--primary-blue) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 8px !important;
                font-size: 11pt !important;
                border: 1px solid #aaa !important;
                font-family: 'Cairo', sans-serif !important;
            }
            td {
                padding: 6px 8px !important;
                font-size: 10pt !important;
                border: 1px solid #ccc !important;
                font-family: 'Cairo', sans-serif !important;
            }
            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .dept-row {
                background-color: #F3F4F6 !important;
                color: var(--primary-blue) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-after: avoid !important;
                break-after: avoid !important;
                font-family: 'Cairo', sans-serif !important;
            }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="splash-screen">
        <img src="Airportlogo" alt="Splash Logo" class="splash-logo">
    </div>

    <!-- الهيدر والعنوان أسفل اللوجو -->
    <div class="top-header">
        <img src="Airportlogo" alt="Marsa Alam Logo" class="center-logo" id="secret-logo" title="الضغط 3 مرات للتعديل">
        <h2 class="sub-title">دليل هاتف مطار مرسي علم الدولي</h2>
    </div>

    <div class="container">
        <div class="controls-bar">
            <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> طباعة الدليل</button>
            <button class="btn btn-add" id="add-btn" onclick="openModal()"><i class="fas fa-plus"></i> إضافة رقم جديد</button>
            <button class="btn btn-exit-admin" id="exit-admin-btn" onclick="exitAdminMode()"><i class="fas fa-sign-out-alt"></i> إنهاء التعديل</button>
            
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="ابحث بالاسم، الوظيفة، الإدارة..." oninput="filterTable()">
                <i class="fas fa-times clear-icon" id="clear-search-btn" onclick="clearSearch()" title="مسح البحث"></i>
            </div>
        </div>

        <div class="table-container">
            <table id="directory-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">م</th>
                        <th>الإسم</th>
                        <th>الوظيفة</th>
                        <th>رقم أرضي</th>
                        <th>موبايل</th>
                        <th class="action-cell">إجراء</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" class="loading">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color: var(--primary-blue); border-bottom: 1px solid #ccc; padding-bottom: 10px;">إضافة رقم جديد</h3>
            <input type="hidden" id="emp-id">
            <input type="text" id="emp-dept" placeholder="الإدارة">
            <input type="text" id="emp-name" placeholder="الإسم">
            <input type="text" id="emp-role" placeholder="الوظيفة">
            <input type="text" id="emp-ext" placeholder="الرقم الأرضي">
            <input type="text" id="emp-mobile" placeholder="الموبايل">
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-add" style="display:block; flex: 1;" onclick="saveRecord()">حفظ</button>
                <button class="btn btn-print" style="background:#6c757d; flex: 1;" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwb6SSVOS6nUk9sq5o7dK2QIn3sVDAXZWXt_6wpGW1tvTUYdjSUAlUm5IIqNGBFrTOZcg/exec'; 
        
        let isAdmin = false;
        let adminPassword = "";
        let directoryData = [];

        window.onload = () => {
            setTimeout(() => {
                let splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500); 
            }, 2500);
            loadData();
        };

        let clicks = 0;
        let clickTimer;
        document.getElementById('secret-logo').addEventListener('click', () => {
            clicks++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clicks = 0; }, 1500); 
            if (clicks === 3) {
                if(isAdmin) { alert("أنت بالفعل في وضع التعديل!"); clicks = 0; return; }
                let pwd = prompt("أدخل الرقم السري:");
                if (pwd === "102030") {
                    adminPassword = pwd;
                    isAdmin = true;
                    document.getElementById('add-btn').style.display = 'flex';
                    document.getElementById('exit-admin-btn').style.display = 'flex';
                    document.querySelectorAll('.action-cell').forEach(cell => cell.style.display = 'table-cell');
                }
                clicks = 0;
            }
        });

        function exitAdminMode() {
            isAdmin = false;
            adminPassword = "";
            document.getElementById('add-btn').style.display = 'none';
            document.getElementById('exit-admin-btn').style.display = 'none';
            document.querySelectorAll('.action-cell').forEach(cell => cell.style.display = 'none');
        }

        async function loadData() {
            try {
                let response = await fetch(API_URL);
                directoryData = await response.json();
                renderTable(directoryData);
            } catch (error) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">تعذر الاتصال بقاعدة البيانات.</td></tr>';
            }
        }

        function renderTable(data) {
            let tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if(data.length === 0) return tbody.innerHTML = '<tr><td colspan="6">لا توجد بيانات</td></tr>';

            let groupedData = {};
            data.forEach(row => {
                let dept = row.Department || 'إدارات أخرى';
                if (!groupedData[dept]) groupedData[dept] = [];
                groupedData[dept].push(row);
            });

            let counter = 1;
            for (const [dept, employees] of Object.entries(groupedData)) {
                tbody.innerHTML += `<tr class="dept-row"><td colspan="6">${dept}</td></tr>`;
                employees.forEach(emp => {
                    let empId = emp.ID || counter; 
                    tbody.innerHTML += `
                        <tr>
                            <td>${counter}</td>
                            <td>${emp.Name || ''}</td>
                            <td>${emp.Role || ''}</td>
                            <td style="color: var(--danger-red); font-weight: bold;">${emp.Ext || ''}</td>
                            <td style="direction: ltr;">${emp.Mobile || ''}</td>
                            <td class="action-cell">
                                <div class="action-btns">
                                    <button class="btn-icon btn-edit" onclick="editRecord('${empId}')"><i class="fas fa-pen"></i></button>
                                    <button class="btn-icon btn-delete" onclick="deleteRecord('${empId}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                    counter++;
                });
            }
            if(isAdmin) {
                document.querySelectorAll('.action-cell').forEach(cell => cell.style.display = 'table-cell');
            }
        }

        function filterTable() {
            let input = document.getElementById("search-input").value.toLowerCase();
            document.getElementById("clear-search-btn").style.display = input.length > 0 ? "block" : "none";

            let filteredData = directoryData.filter(row => 
                (row.Name && row.Name.toLowerCase().includes(input)) ||
                (row.Role && row.Role.toLowerCase().includes(input)) ||
                (row.Department && row.Department.toLowerCase().includes(input)) ||
                (row.Ext && row.Ext.toString().includes(input)) ||
                (row.Mobile && row.Mobile.toString().includes(input))
            );
            renderTable(filteredData);
        }

        function clearSearch() {
            let searchInput = document.getElementById("search-input");
            searchInput.value = ""; 
            searchInput.focus(); 
            filterTable(); 
        }

        function openModal(id = null) {
            document.getElementById('admin-modal').style.display = 'flex';
            if (id) {
                document.getElementById('modal-title').innerText = 'تعديل بيانات الموظف';
                let emp = directoryData.find(e => e.ID == id);
                if(emp) {
                    document.getElementById('emp-id').value = emp.ID;
                    document.getElementById('emp-dept').value = emp.Department;
                    document.getElementById('emp-name').value = emp.Name;
                    document.getElementById('emp-role').value = emp.Role;
                    document.getElementById('emp-ext').value = emp.Ext;
                    document.getElementById('emp-mobile').value = emp.Mobile;
                }
            } else {
                document.getElementById('modal-title').innerText = 'إضافة رقم جديد';
                document.getElementById('emp-id').value = 'DIR-' + (directoryData.length + 1);
                document.querySelectorAll('.modal-content input[type="text"]').forEach(i => i.value = '');
            }
        }

        function closeModal() { document.getElementById('admin-modal').style.display = 'none'; }

        async function saveRecord() {
            let id = document.getElementById('emp-id').value;
            let payload = {
                password: adminPassword,
                action: directoryData.some(e => e.ID == id) ? 'edit' : 'add',
                id: id, department: document.getElementById('emp-dept').value,
                name: document.getElementById('emp-name').value, role: document.getElementById('emp-role').value,
                ext: document.getElementById('emp-ext').value, mobile: document.getElementById('emp-mobile').value
            };
            closeModal();
            document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="loading">جاري الحفظ...</td></tr>';
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
            loadData();
        }

        function editRecord(id) { openModal(id); }
        async function deleteRecord(id) {
            if(confirm('تأكيد الحذف؟')) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="loading">جاري الحذف...</td></tr>';
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ password: adminPassword, action: 'delete', id: id }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
                loadData();
            }
        }
    </script>
</body>
</html>
