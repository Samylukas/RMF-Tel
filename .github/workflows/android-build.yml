name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Configure Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp Airportlogo.png www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Airport Directory" "com.airport.directory" --web-dir "www"

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes Conflict & Enable Auto-Rotate
        run: |
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug -PkotlinVersion=1.9.22

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
